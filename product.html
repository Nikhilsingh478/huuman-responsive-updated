<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Product Page</title>
  <link rel="stylesheet"
    href="https://gistcdn.githack.com/mfd/09b70eb47474836f25a21660282ce0fd/raw/e06a670afcb2b861ed2ac4a1ef752d062ef6b46b/Gilroy.css">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <!-- Custom Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Kajiro&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Kajiro';
      src: url('Kajiro.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    body {
      background-color: #fbf5e9;
      font-family: 'Gilroy', sans-serif;
    }

    .title-font {
      font-family: 'Kajiro', sans-serif;
    }

    @media (max-width: 768px) {
      /* Ensure inputs/buttons/texts scale properly */
      .text-3xl {
        font-size: 1.5rem !important;
      }

      .text-4xl {
        font-size: 1.75rem !important;
      }

      .text-xl {
        font-size: 1.125rem !important;
      }

      .text-2xl {
        font-size: 1.25rem !important;
      }

      .sm\:w-48 {
        width: 100% !important;
      }

      .sm\:flex-row {
        flex-direction: column !important;
      }

      .sm\:p-6 {
        padding: 1.25rem !important;
      }

      /* Images maintain square layout and don't overflow */
      .main-preview,
      .preview-thumb {
        height: auto !important;
        aspect-ratio: 1 / 1;
      }
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center px-4 py-6">

  <div class="flex flex-col lg:flex-row w-full max-w-6xl shadow-xl rounded-lg bg-white overflow-hidden">

    <!-- Left: Image Grid -->
    <div class="grid grid-cols-2 gap-[3px] p-4 w-full lg:w-1/2">
      <!-- Left large vertical image -->
      <div class="row-span-2">
        <img src="" class="main-preview w-full h-full object-cover rounded" alt="Img1">
      </div>
      <!-- Top right square -->
      <img src="" class="preview-thumb w-full h-full object-cover rounded" alt="Img2">
      <!-- Bottom right square -->
      <img src="" class="preview-thumb w-full h-full object-cover rounded" alt="Img3">
    </div>

    <!-- Right: Product details -->
    <div class="p-4 sm:p-6 flex flex-col justify-between w-full lg:w-1/2 space-y-4">
      <div>
        <!-- Title -->
        <h2 class="text-3xl sm:text-4xl font-light text-gray-800 mb-2 title-font" id="product-title">
          TRIPR Black T-Shirt
        </h2>

        <!-- Price -->
        <p class="text-xl sm:text-2xl text-green-700 font-semibold mb-4" id="product-price">₹260</p>

        <!-- Sizes -->
        <div class="flex flex-wrap gap-2 sm:gap-3 mt-4">
          <button class="border px-4 py-1 rounded hover:bg-black hover:text-white transition">S</button>
          <button class="border px-4 py-1 rounded hover:bg-black hover:text-white transition">M</button>
          <button class="border px-4 py-1 rounded hover:bg-black hover:text-white transition">L</button>
          <button class="border px-4 py-1 rounded hover:bg-black hover:text-white transition">XL</button>
          <button class="border px-4 py-1 rounded hover:bg-black hover:text-white transition">XXL</button>
        </div>

        <!-- Delivery Info -->
        <div class="mt-6 space-y-2">
          <p class="text-gray-700 font-semibold">Deliver to:</p>
          <input type="text" placeholder="Enter Pincode" class="border px-4 py-2 w-full sm:w-48 rounded" />
          <p class="text-sm text-gray-600">Delivery by <span class="font-medium text-black">15 Jul, Tuesday</span></p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-col sm:flex-row gap-4 mt-6 w-full">
        <button class="bg-[#9cccec] text-white font-semibold py-2 px-6 rounded hover:bg-blue-400 transition">
          Add to Cart
        </button>
        <button class="bg-[#645c8c] text-white font-semibold py-2 px-6 rounded hover:bg-purple-700 transition">
          Buy Now
        </button>
      </div>
    </div>

  </div>

  <!-- ✅ GSAP Animation -->
  <script src="data.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const productId = localStorage.getItem('selectedProductId');
      const product = productData.find(p => p.id == productId);

      if (product) {
        // Title & price
        document.getElementById('product-title').textContent = product.name;
        document.getElementById('product-price').textContent = product.price;

        // Images
        const mainImage = document.querySelector(".main-preview");
        const thumbs = document.querySelectorAll(".preview-thumb");

        if (product.images.length >= 3) {
          mainImage.src = product.images[0];
          thumbs[0].src = product.images[1];
          thumbs[1].src = product.images[2];
        }
      }
    });

    window.addEventListener('load', () => {
      const timeline = gsap.timeline({ defaults: { duration: 0.8, ease: "power2.out" } });

      // Animate images
      timeline.from("img", {
        opacity: 0,
        y: 30,
        stagger: 0.15
      });

      // Animate title and price
      timeline.from(["#product-title", "#product-price"], {
        x: 40,
        opacity: 0,
        stagger: 0.2
      }, "-=0.5");
    });
  </script>
</body>

</html>
